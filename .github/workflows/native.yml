name: native

# Builds the native code and the app and runs the tests that need nothing
# outside the runner. Nothing here connects to the Tor network or starts a
# Monero daemon; see docs/development.md.
on:
  pull_request:
    paths:
      - "native/**"
      - "dart/**"
      - "app/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # aws-lc-sys assembles with NASM on Windows. Where the runner has no
      # NASM, use the assembled objects that ship inside the crate instead
      # of failing the build. Ignored on Linux and when NASM is present.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
      - name: Install the pinned toolchain
        run: rustup show
      # What Flutter needs to build a desktop app on Linux, from the
      # distribution's own packages.
      - name: Install the libraries the app's Linux build needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build libgtk-3-dev liblzma-dev
      # One version, named in check.sh, downloaded from its publisher and
      # checked against its published checksum. Its usage reporting is
      # switched off before anything else is run.
      - name: Install the pinned Flutter
        shell: bash
        run: bash check.sh flutter
      # The same command a developer runs before committing: the native
      # code, the Dart side of the core, and the app with a build for this
      # system. The script refuses every level but these two on a CI runner.
      - name: Format, lint, offline tests, and the app's build
        shell: bash
        run: bash check.sh offline
