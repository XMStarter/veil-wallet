[package]
name = "veil_cli"
description = "Command-line wallet for trying Veil's core on the Monero stagenet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
veil_core = { path = "../veil_core" }
veil_tor = { path = "../veil_tor" }
veil_wallet = { path = "../veil_wallet" }
# Operating-system randomness, to pick nodes in no predictable order.
getrandom = "0.3"
# Reads a password from the terminal without showing it.
rpassword = "7"
zeroize = "1"

[dev-dependencies]
veil_test_guard = { path = "../veil_test_guard" }
