[package]
name = "veil_tor"
description = "Embedded Tor client for the Veil wallet: Arti plus a loopback SOCKS listener"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Adds `StandIn`: the same loopback SOCKS listeners, leading to local ports
# instead of into Tor, so that code using them can be tested without a
# network. Never enabled in the app.
stand-in = []

[dependencies]
# static-sqlite compiles SQLite into the library, so no platform needs a
# system copy (Windows and Android do not ship one).
# pt-client lets Tor connect through bridges and start the programs that
# speak their transports (obfs4, Snowflake, WebTunnel).
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression", "static-sqlite", "pt-client"] }
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"] }
# Arti leaves the choice of TLS cryptography to the application.
# aws-lc-rs is the provider the Arti project recommends.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tor-socksproto = { version = "0.48", default-features = false, features = ["proxy-handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
veil_test_guard = { path = "../veil_test_guard" }

[lints]
workspace = true
