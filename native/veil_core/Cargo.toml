[package]
name = "veil_core"
description = "The core of Veil: a Monero wallet that reaches its nodes through the embedded Tor client and nothing else"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The app loads the core as a shared library on desktop and links it
# statically where the platform asks for that.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Lets tests run the core against a regtest daemon. Never enabled in the app.
regtest = ["veil_wallet/regtest"]

[dependencies]
veil_tor = { path = "../veil_tor" }
veil_wallet = { path = "../veil_wallet" }
thiserror = "2"
# Wipes the password a session holds until its wallet is open.
zeroize = "1"
# Puts the public nodes in an order nobody can predict.
getrandom = "0.3"
# Commands and state cross the C interface as JSON.
serde_json = "1"

[dev-dependencies]
# The stand-in for Tor is a dev-dependency feature, so it is compiled into
# this crate's tests and never into the crate itself.
veil_tor = { path = "../veil_tor", features = ["stand-in"] }
veil_test_guard = { path = "../veil_test_guard" }
