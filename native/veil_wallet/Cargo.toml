[package]
name = "veil_wallet"
description = "Wallet operations for Veil on top of the official Monero wallet library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets tests connect straight to a local regtest daemon and accept its
# hard-fork schedule. Never enabled in the app.
regtest = []

[dependencies]
libloading = "0.8"
thiserror = "2"
zeroize = "1"

# For the lock that marks a wallet as open: see `lock_now` in wallet.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
veil_test_guard = { path = "../veil_test_guard" }
